openapi: 3.1.0
info:
  title: Kin Gateway v2 API
  version: 0.1.0
  description: Reference data-plane and control-plane contract.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: kernelHealth
      responses:
        "200":
          description: Kernel process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: kernelReady
      responses:
        "200":
          description: Kernel has usable capacity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Kernel cannot accept compatible work.
  /v1/messages:
    post:
      operationId: createMessage
      parameters:
        - $ref: "#/components/parameters/SessionHeader"
        - $ref: "#/components/parameters/ContinuationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: Message result.
          headers:
            x-kin-session-id:
              schema: {type: string}
            x-kin-continuation:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      parameters:
        - $ref: "#/components/parameters/SessionHeader"
        - $ref: "#/components/parameters/ContinuationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat completion result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          $ref: "#/components/responses/Error"
  /internal/v1/slots:
    get:
      operationId: listSlots
      responses:
        "200":
          description: Demo worker and slot observations.
  /api/v1/kernels:
    servers:
      - url: http://localhost:9090
    get:
      operationId: listKernels
      security: [{InternalBearer: []}]
      responses:
        "200": {description: Registered kernels.}
    post:
      operationId: registerKernel
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KernelRegistration"
      responses:
        "200": {description: Kernel registered.}
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/kernels/{id}/heartbeat:
    servers:
      - url: http://localhost:9090
    post:
      operationId: heartbeatKernel
      security: [{InternalBearer: []}]
      parameters:
        - $ref: "#/components/parameters/KernelID"
      responses:
        "204": {description: Heartbeat accepted.}
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/kernels/{id}/drain:
    servers:
      - url: http://localhost:9090
    post:
      operationId: drainKernel
      security: [{InternalBearer: []}]
      parameters:
        - $ref: "#/components/parameters/KernelID"
      responses:
        "202": {description: Drain requested.}
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/route-policies/{name}:
    servers:
      - url: http://localhost:9090
    get:
      operationId: getRoutePolicy
      security: [{InternalBearer: []}]
      parameters:
        - $ref: "#/components/parameters/PolicyName"
      responses:
        "200":
          description: Route policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePolicy"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: putRoutePolicy
      security: [{InternalBearer: []}]
      parameters:
        - $ref: "#/components/parameters/PolicyName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutePolicy"
      responses:
        "200":
          description: Route policy stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePolicy"
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/snapshots/current:
    servers:
      - url: http://localhost:9090
    get:
      operationId: getCurrentSnapshot
      security: [{InternalBearer: []}]
      responses:
        "200": {description: Current immutable configuration snapshot.}
  /api/v1/reconcile:
    servers:
      - url: http://localhost:9090
    post:
      operationId: reconcileNow
      security: [{InternalBearer: []}]
      responses:
        "200": {description: Reconcile result.}
  /api/v1/config/routing:
    servers: [{url: http://localhost:9090}]
    get:
      operationId: getRoutingConfig
      security: [{InternalBearer: []}]
      responses:
        "200":
          description: Typed routing configuration and apply state.
          content: {application/json: {schema: {$ref: "#/components/schemas/RoutingEnvelope"}}}
    put:
      operationId: putRoutingConfig
      security: [{InternalBearer: []}]
      parameters: [{$ref: "#/components/parameters/OperatorHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/RoutingPut"}}}
      responses:
        "200":
          description: Routing configuration committed.
          content: {application/json: {schema: {$ref: "#/components/schemas/RoutingEnvelope"}}}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/config/model-policy:
    servers: [{url: http://localhost:9090}]
    get:
      operationId: getModelPolicyConfig
      security: [{InternalBearer: []}]
      responses:
        "200":
          description: Typed model policy and apply state.
          content: {application/json: {schema: {$ref: "#/components/schemas/ModelPolicyEnvelope"}}}
        "404": {$ref: "#/components/responses/Error"}
    put:
      operationId: putModelPolicyConfig
      security: [{InternalBearer: []}]
      parameters: [{$ref: "#/components/parameters/OperatorHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ModelPolicyPut"}}}
      responses:
        "200":
          description: Model policy committed and effective.
          content: {application/json: {schema: {$ref: "#/components/schemas/ModelPolicyEnvelope"}}}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/slots/{id}:
    servers: [{url: http://localhost:9090}]
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, maxLength: 128}}
    get:
      operationId: getSlotConfig
      security: [{InternalBearer: []}]
      responses:
        "200":
          description: Slot overrides, effective policy, and apply state.
          content: {application/json: {schema: {$ref: "#/components/schemas/SlotEnvelope"}}}
    patch:
      operationId: patchSlotConfig
      security: [{InternalBearer: []}]
      parameters: [{$ref: "#/components/parameters/OperatorHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SlotPatch"}}}
      responses:
        "200":
          description: Slot desired policy committed.
          content: {application/json: {schema: {$ref: "#/components/schemas/SlotEnvelope"}}}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/slots/policy:
    servers: [{url: http://localhost:9090}]
    post:
      operationId: patchSlotPolicyBatch
      security: [{InternalBearer: []}]
      parameters: [{$ref: "#/components/parameters/OperatorHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/SlotBatchPatch"}}}
      responses:
        "200":
          description: Per-slot updates; commits are ordered and may be partial on a later failure.
          content: {application/json: {schema: {$ref: "#/components/schemas/SlotBatchResult"}}}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/config/proxy-pool:
    servers: [{url: http://localhost:9090}]
    get:
      operationId: getProxyPoolConfig
      security: [{InternalBearer: []}]
      responses:
        "200":
          description: Typed proxy pool config. GET never includes credentials.
          content: {application/json: {schema: {$ref: "#/components/schemas/ProxyPoolEnvelope"}}}
    put:
      operationId: putProxyPoolConfig
      security: [{InternalBearer: []}]
      parameters: [{$ref: "#/components/parameters/OperatorHeader"}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ProxyPoolPut"}}}
      responses:
        "200": {description: Proxy pool config committed.}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /api/v1/proxies:
    servers: [{url: http://localhost:9090}]
    get:
      operationId: listProxies
      security: [{InternalBearer: []}]
      responses:
        "200":
          description: Desensitized proxy list plus pool config and totals.
          content: {application/json: {schema: {$ref: "#/components/schemas/ProxyPoolSnapshot"}}}
  /api/v1/proxies/{id}/reveal:
    servers: [{url: http://localhost:9090}]
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: revealProxy
      security: [{InternalBearer: []}]
      parameters: [{$ref: "#/components/parameters/OperatorHeader"}]
      responses:
        "200":
          description: The only plaintext credential response. URI only. Do not cache.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema:
                type: object
                required: [id, uri]
                additionalProperties: false
                properties:
                  id: {type: string}
                  uri: {type: string}
        "503": {$ref: "#/components/responses/Error"}

  /api/v1/config/documents/{domain}:
    servers:
      - url: http://localhost:9090
    parameters:
      - name: domain
        in: path
        required: true
        description: Configuration domain; may include slash-separated segments.
        schema: {type: string, maxLength: 128}
    get:
      operationId: getControlDocument
      security: [{InternalBearer: []}]
      responses:
        "200":
          description: Current valid document, or the last-known-good version with degraded=true.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ControlDocument"}
        "404": {$ref: "#/components/responses/Error"}
    put:
      operationId: putControlDocument
      security: [{InternalBearer: []}]
      parameters:
        - $ref: "#/components/parameters/OperatorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ControlDocumentPut"}
      responses:
        "200":
          description: Versioned document committed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ControlDocument"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/migration/domains/{domain}:
    servers:
      - url: http://localhost:9090
    parameters:
      - name: domain
        in: path
        required: true
        schema: {type: string, maxLength: 128}
    get:
      operationId: getDomainOwner
      security: [{InternalBearer: []}]
      responses:
        "200":
          description: Current single-writer owner and cutover state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DomainOwner"}
    put:
      operationId: putDomainOwner
      security: [{InternalBearer: []}]
      parameters:
        - $ref: "#/components/parameters/OperatorHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DomainOwnerPut"}
      responses:
        "200":
          description: Domain owner transition committed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DomainOwner"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /api/v1/operations:
    servers:
      - url: http://localhost:9090
    post:
      operationId: enqueueControlOperation
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OperationEnqueue"}
      responses:
        "202":
          description: Operation enqueued or existing idempotent operation returned.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ControlOperation"}
        "400": {$ref: "#/components/responses/Error"}
  /api/v1/operations/claim:
    servers:
      - url: http://localhost:9090
    post:
      operationId: claimControlOperation
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [worker, lease_seconds]
              properties:
                worker: {type: string}
                lease_seconds: {type: integer, minimum: 1, maximum: 3600}
      responses:
        "200":
          description: Operation lease acquired.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ControlOperation"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/operations/{id}:
    servers:
      - url: http://localhost:9090
    get:
      operationId: getControlOperation
      security: [{InternalBearer: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Persisted operation state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ControlOperation"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/operations/{id}/complete:
    servers:
      - url: http://localhost:9090
    post:
      operationId: completeControlOperation
      security: [{InternalBearer: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [worker, status]
              properties:
                worker: {type: string}
                status: {type: string, enum: [succeeded, failed, cancelled]}
                result: {}
                last_error: {type: string}
      responses:
        "200":
          description: Operation completed by its current lease owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ControlOperation"}
        "400": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
      description: KIN_CONTROL_INTERNAL_TOKEN shared only with trusted internal callers.
  parameters:
    SessionHeader:
      name: x-kin-session-id
      in: header
      required: false
      schema: {type: string, maxLength: 128}
    ContinuationHeader:
      name: x-kin-continuation
      in: header
      required: false
      schema: {type: string, maxLength: 128}
    KernelID:
      name: id
      in: path
      required: true
      schema: {type: string, maxLength: 128}
    PolicyName:
      name: name
      in: path
      required: true
      schema: {type: string, maxLength: 128}
    OperatorHeader:
      name: x-kin-operator
      in: header
      required: false
      schema: {type: string, maxLength: 128}
      description: Trusted operator identity supplied by the Node BFF; defaults to control-api.
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string}
    ContentBlock:
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type: {const: text}
            text: {type: string}
        - type: object
          required: [type, id, name, input]
          properties:
            type: {const: tool_use}
            id: {type: string}
            name: {type: string}
            input: {}
        - type: object
          required: [type, tool_use_id, content]
          properties:
            type: {const: tool_result}
            tool_use_id: {type: string}
            content: {}
            is_error: {type: boolean}
    Message:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [user, assistant, system, tool]}
        content:
          oneOf:
            - {type: string}
            - type: array
              items:
                $ref: "#/components/schemas/ContentBlock"
    ToolDefinition:
      type: object
      required: [name, input_schema]
      properties:
        name: {type: string}
        description: {type: string}
        input_schema: {type: object}
    MessageRequest:
      type: object
      required: [model, messages, max_tokens]
      properties:
        model: {type: string}
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Message"
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ToolDefinition"
        max_tokens: {type: integer, minimum: 1}
        stream: {type: boolean, default: false}
    Usage:
      type: object
      required: [input_tokens, output_tokens]
      properties:
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
    MessageResponse:
      type: object
      required: [id, type, role, model, content, stop_reason, usage]
      properties:
        id: {type: string}
        type: {const: message}
        role: {const: assistant}
        model: {type: string}
        content:
          type: array
          items:
            $ref: "#/components/schemas/ContentBlock"
        stop_reason:
          type: string
          enum: [end_turn, tool_use, max_tokens, stop_sequence, pause_turn, refusal, model_context_window_exceeded, unknown]
        usage:
          $ref: "#/components/schemas/Usage"
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: {type: string}
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Message"
        stream: {type: boolean, default: false}
    ChatResponse:
      type: object
      required: [id, object, model, choices, usage]
      properties:
        id: {type: string}
        object: {const: chat.completion}
        model: {type: string}
        choices: {type: array}
        usage: {type: object}
    ErrorResponse:
      type: object
      required: [type, error]
      properties:
        type: {const: error}
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            request_id: {type: string}
    KernelRegistration:
      type: object
      required: [id, address, capacity, provider]
      properties:
        id: {type: string}
        address: {type: string}
        capacity: {type: integer, minimum: 1}
        provider: {type: string}
        revision: {type: integer, minimum: 0}
    RoutePolicy:
      type: object
      required: [name, tenant, model_pattern, provider, slot_group, max_inflight, max_waiting_tool]
      properties:
        name: {type: string}
        tenant: {type: string}
        model_pattern: {type: string}
        provider: {type: string}
        slot_group: {type: string}
        max_inflight: {type: integer, minimum: 1}
        max_waiting_tool: {type: integer, minimum: 0}
    ApplyStatus:
      type: object
      additionalProperties: false
      required: [state, desired_revision, effective_revision]
      properties:
        state: {type: string, enum: [effective, pending_restart, rejected]}
        desired_revision: {type: integer, minimum: 0}
        effective_revision: {type: integer, minimum: 0}
        last_error: {type: string, maxLength: 4096}
    PersonaTemplateBlock:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        id: {type: string, maxLength: 128}
        note: {type: string, maxLength: 256}
        drop_if_empty: {type: boolean}
        hide: {type: boolean}
        type: {type: string, enum: [text, wrapper]}
        text: {type: string, maxLength: 40000}
        cache_control:
          type: object
          additionalProperties: false
          properties:
            type: {type: string, enum: [ephemeral]}
    PersonaRule:
      type: object
      additionalProperties: false
      required: [id, enabled, no_tools_only, match, append]
      properties:
        id: {type: string, maxLength: 128}
        enabled: {type: boolean}
        no_tools_only: {type: boolean}
        match: {type: array, maxItems: 64, items: {type: string, maxLength: 1024}}
        append: {type: string, maxLength: 40000}
    CompatibilityConfig:
      type: object
      additionalProperties: false
      required: [tool_name_rewrite, cache_control_limit, persona_templates, overlay_preset, overlay_templates, persona_standing, persona_leak_append, persona_rules, cache_ttl]
      properties:
        tool_name_rewrite: {type: boolean}
        cache_control_limit: {type: integer, minimum: 0, maximum: 32}
        persona_inject: {type: string}
        persona_agent: {type: string}
        persona_park: {type: boolean}
        persona_park_style: {type: string}
        persona_expansion: {type: string}
        persona_preset: {type: string, enum: [official, zero, custom]}
        persona_templates:
          type: object
          additionalProperties:
            type: array
            maxItems: 24
            items: {$ref: "#/components/schemas/PersonaTemplateBlock"}
        overlay_preset: {type: string, enum: [off, official, minimal, custom]}
        overlay_templates:
          type: object
          additionalProperties:
            type: array
            maxItems: 24
            items: {$ref: "#/components/schemas/PersonaTemplateBlock"}
        persona_standing: {type: string, maxLength: 40000}
        persona_leak_append: {type: string, maxLength: 40000}
        persona_rules:
          type: array
          maxItems: 128
          items: {$ref: "#/components/schemas/PersonaRule"}
        cache_ttl: {type: string, maxLength: 32}
    RoutingConfig:
      type: object
      additionalProperties: false
      required: [sticky, concurrency, quota, tiers, pool, failover, inference, compatibility]
      properties:
        sticky:
          type: object
          additionalProperties: false
          required: [enabled, mode, ttl_seconds, header_keys, body_keys]
          properties:
            enabled: {type: boolean}
            mode: {type: string, enum: [conversation, none]}
            ttl_seconds: {type: integer, minimum: 1, maximum: 2592000}
            header_keys: {type: array, maxItems: 32, items: {type: string, maxLength: 128}}
            body_keys: {type: array, maxItems: 32, items: {type: string, maxLength: 128}}
        concurrency:
          type: object
          additionalProperties: false
          required: [default_max_per_account, default_key_concurrency, fable_max_per_account]
          properties:
            default_max_per_account: {type: integer, minimum: 1, maximum: 1000}
            default_key_concurrency: {type: integer, minimum: 1, maximum: 1000}
            default_max_rpm: {type: integer, minimum: 0, maximum: 1000000}
            fable_max_per_account: {type: integer, minimum: 1, maximum: 1000}
        quota:
          type: object
          additionalProperties: false
          required: [safety_ratio, weekly_safety_ratio, warn_ratio, block_on_5h, block_on_7d, weekly_split]
          properties:
            safety_ratio: {type: number, minimum: 0, maximum: 1}
            weekly_safety_ratio: {type: number, minimum: 0, maximum: 1}
            warn_ratio: {type: number, minimum: 0, maximum: 1}
            block_on_5h: {type: boolean}
            block_on_7d: {type: boolean}
            weekly_split:
              type: object
              additionalProperties: false
              required: [enabled, fable_share]
              properties:
                enabled: {type: boolean}
                fable_share: {type: number, minimum: 0, maximum: 1}
        tiers:
          type: object
          required: [default, pro, max]
          additionalProperties: {$ref: "#/components/schemas/TierPolicy"}
        pool:
          type: object
          additionalProperties: false
          required: [strategy, manual_schedule_wins, max_waiters_per_account, fallback_wait_timeout_ms, sticky_wait_timeout_ms, worker_health_ttl_ms, heartbeat_stale_ms]
          properties:
            strategy: {type: string, enum: [weighted-round-robin]}
            manual_schedule_wins: {type: boolean}
            max_waiters_per_account: {type: integer, minimum: 1, maximum: 10000}
            fallback_wait_timeout_ms: {type: integer, minimum: 0, maximum: 600000}
