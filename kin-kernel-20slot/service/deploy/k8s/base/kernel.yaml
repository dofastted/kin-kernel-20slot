apiVersion: apps/v1
kind: Deployment
metadata:
  name: kin-kernel
  namespace: kin-system
  labels:
    app.kubernetes.io/name: kin-kernel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kin-kernel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kin-kernel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kernel
          image: kin-kernel:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kin-kernel-config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 45
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kin-kernel
  namespace: kin-system
spec:
  selector:
    app.kubernetes.io/name: kin-kernel
  ports:
    - name: http
      port: 8080
      targetPort: http

