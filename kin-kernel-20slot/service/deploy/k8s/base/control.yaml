apiVersion: apps/v1
kind: Deployment
metadata:
  name: kin-control
  namespace: kin-system
  labels:
    app.kubernetes.io/name: kin-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kin-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kin-control
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control
          image: kin-control:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: kin-control-config
          env:
            - name: KIN_CONTROL_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kin-control-secrets
                  key: internal-token
                  optional: true
            - name: KIN_DB_SECRET
              valueFrom:
                secretKeyRef:
                  name: kin-control-secrets
                  key: db-secret
                  optional: true
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: data
              mountPath: /var/lib/kin
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: data
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kin-control
  namespace: kin-system
spec:
  selector:
    app.kubernetes.io/name: kin-control
  ports:
    - name: http
      port: 9090
      targetPort: http

