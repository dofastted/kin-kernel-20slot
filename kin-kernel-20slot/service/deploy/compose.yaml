name: kin-gateway-v2
services:
  kernel:
    build:
      context: ../kernel
      dockerfile: Dockerfile
    environment:
      KIN_KERNEL_ADDR: 0.0.0.0:8080
      KIN_WORKER_COUNT: "4"
      KIN_SLOTS_PER_WORKER: "5"
      KIN_MAX_BODY_BYTES: "2097152"
      KIN_MAX_SESSION_BYTES: "16777216"
      KIN_SESSION_TTL_SECONDS: "3600"
      KIN_CONTINUATION_TTL_SECONDS: "600"
      KIN_DEFAULT_TENANT: demo
      KIN_EXPOSE_SLOT_HEADER: "true"
      KIN_PROVIDER: mock
      RUST_LOG: kin_kernel=info,tower_http=info
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - kin

  control:
    build:
      context: ../control
      dockerfile: Dockerfile
    environment:
      KIN_CONTROL_ADDR: 0.0.0.0:9090
      KIN_HEARTBEAT_TIMEOUT_SECONDS: "20"
      KIN_RECONCILE_INTERVAL_SECONDS: "5"
      KIN_SNAPSHOT_TTL_SECONDS: "3600"
    ports:
      - "9090:9090"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - kin

networks:
  kin:
    driver: bridge
